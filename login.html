<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jan Raksha - Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-bg">
  <div class="login-container">
    <img src="logo.png" alt="Jan Raksha Logo" class="logo">
    <h1>Jan Raksha Civic Emergency Assistant</h1>
    <p class="tagline">Smart, Secure & Swift Emergency Response</p>
    
    <form onsubmit="goToMain(event)">
      <input type="text" id="name" placeholder="Full Name" required />
      <input type="tel" id="phone" placeholder="Phone Number" required />
      <button type="submit" class="login-btn">Login</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
